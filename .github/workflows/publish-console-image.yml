# Build and publish the BioCypher KG Console image to GHCR, so local users can
# pull a prebuilt image instead of building it (which needs a reliable connection
# to Docker Hub and several minutes). Pull with:
#
#   CONSOLE_IMAGE=ghcr.io/<owner>/biocypher-kg-console:latest \
#     docker compose -f docker/docker-compose.yml pull console
#
# then run up.sh with --no-build.
name: Publish Console image

on:
  push:
    branches:
      - console
    tags:
      - "v*"
      - "console-v*"
  workflow_dispatch: {}

# A newer push to the same branch supersedes an in-flight build (the image is
# heavy); cancel the older run so we don't waste minutes publishing a stale commit.
concurrency:
  group: console-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/biocypher-kg-console
          # Every push to console publishes :console and an immutable :sha-<short>;
          # a release tag publishes :<tag>; :latest tracks the console branch so the
          # CONSOLE_IMAGE=...:latest examples keep pulling the newest console build.
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/console' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
