version: '3.8'

services:
  mork-biocypher:
    build: .
    container_name: mork-biocypher
    env_file:
      - .env
    ports:
      - "${HOST_PORT:-8027}:8027"
    volumes:
      - ${MORK_DATA_DIR:-./data}:/app/data
      # Broad host root mounted at the SAME path (read-only) so the loader can import
      # from ANY directory via absolute file://<abs> URIs (not just /app/data).
      # Set MORK_IMPORT_ROOT to the parent that contains your .metta outputs; defaults
      # to MORK_DATA_DIR so the mount is always valid.
      - ${MORK_IMPORT_ROOT:-${MORK_DATA_DIR:-./data}}:${MORK_IMPORT_ROOT:-${MORK_DATA_DIR:-./data}}:ro
      - ./reports:/app/reports
      # Persistent snapshot volume — graph state survives restarts
      - ./mork_persist:/app/persist
      - ./entrypoint.sh:/app/entrypoint.sh
    environment:
      - RUST_LOG=info
      - SNAPSHOT_DIR=/app/persist
      - SNAPSHOT_INTERVAL_SECONDS=${SNAPSHOT_INTERVAL_SECONDS:-300}
      - MORK_URL=http://127.0.0.1:8027
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8027/status/-"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
# Removed named volumes to favor host bind-mounts for synchronization

volumes:
  data:
  reports: