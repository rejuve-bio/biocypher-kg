# Anchor genes for connected sample KG generation (connected_full_sample_data branch).
#
# Same housekeeping gene curation used in config/dmel/dmel_anchor_genes.yaml
# and config/hsa/hsa_anchor_genes.yaml, here with the orthologous WBGene
# (WormBase gene ID) for each gene, already used natively as gene_id in the
# real GTF (Caenorhabditis_elegans.WBcel235.63.gtf.gz) — no conversion needed.
#
# See docs/knowledge-graph/sample-generation.md for the full methodology and the
# cross-species table.

