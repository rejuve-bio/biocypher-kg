# ---
input_dir: /mnt/hdd_1/biocypher-kg/input/cel


# 31_0_0: https://ftp.ebi.ac.uk/pub/databases/eva/rs_releases/release_8/by_species/caenorhabditis_elegans/
alliance:
  name: Alliance of Genome Resources
  version: {strategy: url_regex, pattern: 'alliancegenome\.org/(\d+\.\d+\.\d+)/', vtype: semver}
  extract: false
  url:
    - https://fms.alliancegenome.org/download/DISEASE-ALLIANCE_COMBINED.tsv.gz  # gene to disease
    - https://download.alliancegenome.org/8.3.0/EXPRESSION-ALLIANCE/COMBINED/EXPRESSION-ALLIANCE_COMBINED_6.tsv.gz  # gene to expression location (ontologies like GO, FBbt, etc) NO HUMAN DATA
    - https://download.alliancegenome.org/8.3.0/INTERACTION-MOL/COMBINED/INTERACTION-MOL_COMBINED_5.tsv.gz          # Format is like that processed by dmel.dmel_physical_interaction_psimi_adapter
    - https://fms.alliancegenome.org/download/ORTHOLOGY-ALLIANCE_COMBINED.tsv.gz
    - https://download.alliancegenome.org/8.3.0/VCF/WBcel235/VCF_WBcel235_7.vcf.gz    # look at EVA  VCF
    - https://download.alliancegenome.org/8.3.0/VARIANT-ALLELE/NCBITaxon6239/VARIANT-ALLELE_NCBITaxon6239_8.tsv.gz  # variant/allel
  local_files:
    alliance_disease: {pattern: "alliance/DISEASE-ALLIANCE_COMBINED.tsv.gz", stable_name: "alliance/DISEASE-ALLIANCE_COMBINED.tsv.gz"}
    alliance_orthology: {pattern: "alliance/ORTHOLOGY-ALLIANCE_COMBINED.tsv.gz", stable_name: "alliance/ORTHOLOGY-ALLIANCE_COMBINED.tsv.gz"}

bgee:
  name: Bgee Expression Data
  extract: false
  url: https://www.bgee.org/ftp/current/download/calls/expr_calls/Caenorhabditis_elegans_expr_simple_all_conditions.tsv.gz
  local_files:
    bgee: {pattern: "bgee/Caenorhabditis_elegans_expr_simple_all_conditions.tsv.gz", stable_name: "bgee/Caenorhabditis_elegans_expr_simple_all_conditions.tsv.gz"}

coxpressdb:
  name: Coxpress DB
  version: {strategy: url_regex, pattern: '\.(v[\d-]+)\.', vtype: other}
  url: https://zenodo.org/record/6861444/files/Cel-u.v22-05.G14532-S7142.combat_pca.subagging.z.d.zip

# enhancer_atlas:
#   name: EnhancerAtlas
#   url: http://www.enhanceratlas.org/data/download/enhancer_atlas_2.0/9606_all_tissues.bed   

ensembl:
  name: Ensembl Assembly 235.v63
  extract: false
  url: 
    - https://ftp.ebi.ac.uk/ensemblgenomes/pub/metazoa/current/gtf/caenorhabditis_elegans/Caenorhabditis_elegans.WBcel235.63.gtf.gz
  local_files:
    gtf: {pattern: "ensembl/Caenorhabditis_elegans.WBcel235.*.gtf.gz", stable_name: "ensembl/Caenorhabditis_elegans.gtf.gz"}

epd:
  name: Eukaryotic Promoter Database
  compress: gzip
  url: https://epd.expasy.org/ftp/epdnew/C_elegans/current/Ce_EPDnew.bed
  local_files:
    epd: {pattern: "epd/Ce_EPDnew.bed.gz", stable_name: "epd/Ce_EPDnew.bed.gz"}

gaf:
  name: GO Annotation File (GAF) from GO (WormBase-wb)
  extract: false
  url: http://current.geneontology.org/annotations/wb.gaf.gz
  local_files:
    gaf: {pattern: "gaf/wb.gaf.gz", stable_name: "gaf/wb.gaf.gz"}

reactome:
  name: Reactome
  url:
    - https://reactome.org/download/current/ReactomePathways.txt
    - https://reactome.org/download/current/ReactomePathwaysRelation.txt
    - https://reactome.org/download/current/Ensembl2Reactome_All_Levels.txt
    - https://reactome.org/download/current/Ensembl2ReactomeReactions.txt
    - https://reactome.org/download/current/ReactionPMIDS.txt
    - https://reactome.org/download/current/ChEBI2Reactome_All_Levels.txt
    - https://reactome.org/download/current/ChEBI2ReactomeReactions.txt
    - https://reactome.org/download/current/interactors/reactome.all_species.interactions.tab-delimited.txt
  local_files:
    reactome_all_levels: {pattern: "reactome/Ensembl2Reactome_All_Levels.txt", stable_name: "reactome/Ensembl2Reactome_All_Levels.txt"}
    reactome_chebi_pathways: {pattern: "reactome/ChEBI2Reactome_All_Levels.txt", stable_name: "reactome/ChEBI2Reactome_All_Levels.txt"}
    reactome_chebi_reactions: {pattern: "reactome/ChEBI2ReactomeReactions.txt", stable_name: "reactome/ChEBI2ReactomeReactions.txt"}
    reactome_pathways: {pattern: "reactome/ReactomePathways.txt", stable_name: "reactome/ReactomePathways.txt"}
    reactome_pathways_relation: {pattern: "reactome/ReactomePathwaysRelation.txt", stable_name: "reactome/ReactomePathwaysRelation.txt"}
    reactome_ppi: {pattern: "reactome/reactome.all_species.interactions.tab-delimited.txt", stable_name: "reactome/reactome.all_species.interactions.tab-delimited.txt"}
    reactome_reaction_exporter: {pattern: "reactome/reactome_reaction_exporter_All_species.txt", stable_name: "reactome/reactome_reaction_exporter_All_species.txt"}
    reactome_reaction_pmids: {pattern: "reactome/ReactionPMIDS.txt", stable_name: "reactome/ReactionPMIDS.txt"}
    reactome_reactions: {pattern: "reactome/Ensembl2ReactomeReactions.txt", stable_name: "reactome/Ensembl2ReactomeReactions.txt"}

rna_central:
  name: RNA Central
  extract: false
  url:
    - https://ftp.ebi.ac.uk/pub/databases/RNAcentral/current_release/genome_coordinates/bed/caenorhabditis_elegans.WBcel235.bed.gz
    - https://ftp.ebi.ac.uk/pub/databases/RNAcentral/current_release/go_annotations/rnacentral_rfam_annotations.tsv.gz
  local_files:
    rna_central_bed: {pattern: "rna_central/caenorhabditis_elegans.WBcel235.bed.gz", stable_name: "rna_central/caenorhabditis_elegans.WBcel235.bed.gz"}
    rna_central_rfam: {pattern: "rna_central/rnacentral_rfam_annotations.tsv.gz", stable_name: "rna_central/rnacentral_rfam_annotations.tsv.gz"}

string:
  name: STRING PPI
  extract: false
  url:
    - https://stringdb-downloads.org/download/protein.links.v12.0/6239.protein.links.v12.0.txt.gz
    - https://stringdb-downloads.org/download/protein.links.detailed.v12.0/6239.protein.links.detailed.v12.0.txt.gz  # detailed version
  local_files:
    string_coexpression: {pattern: "string/6239.protein.links.detailed.v*.txt.gz", stable_name: "string/6239.protein.links.detailed.txt.gz"}
    string_ppi: {pattern: "string/6239.protein.links.v*.txt.gz", stable_name: "string/6239.protein.links.txt.gz"}

tflink:
  name: TFLink
  version: {strategy: url_regex, pattern: '_(v[\d.]+)\.tsv', vtype: semver}
  compress: gzip
  url: https://cdn.netbiol.org/tflink/download_files/TFLink_Caenorhabditis_elegans_interactions_All_simpleFormat_v1.0.tsv
  local_files:
    tflink: {pattern: "tflink/TFLink_Caenorhabditis_elegans_interactions_All_simpleFormat_v*.tsv.gz", stable_name: "tflink/TFLink_Caenorhabditis_elegans_interactions_All_simpleFormat.tsv.gz"}

uniprot:
  name: UniProtKB/Swiss-Prot
  extract: false
  url: https://ftp.uniprot.org/pub/databases/uniprot/current_release/knowledgebase/taxonomic_divisions/uniprot_sprot_invertebrates.dat.gz
  local_files:
    uniprot_dat: {pattern: "uniprot/uniprot_sprot_invertebrates.dat.gz", stable_name: "uniprot/uniprot_sprot_invertebrates.dat.gz"}
