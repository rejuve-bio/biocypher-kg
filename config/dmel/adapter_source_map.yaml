# Adapter -> data-source overrides for the source-grouped build wizard (dmel).
#
# The wizard derives an adapter's source from the first path segment of its input
# file (e.g. filepath: "bgee/..."  ->  bgee). Adapters whose source can't be derived
# (ontologies that read bundled files, adapters with no file path) land in the
# "Ontologies / shared" group. To pin any adapter to a specific source, add a line:
#
#     <adapter_name>: <source_key>
#
# where <source_key> is a key from dmel_data_source_config.yaml
# (afca, alliance, bgee, coxpressdb, ensembl, epd, eva, fca2, flybase, reactome,
#  rna_central, string, tflink, uniprot). An override always wins over derivation.
#
# Currently ungrouped adapters (edit as the data dictates; left shared by default
# because these read ontology files, not one of the 14 download sources):
