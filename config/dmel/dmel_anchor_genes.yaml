# Anchor genes for connected sample KG generation (connected_full_sample_data branch).
#
# Curation: housekeeping genes with reciprocal "best score" orthology confirmed
# simultaneously in hsa/mmu/rno/dmel/cel via Alliance of Genome Resources
# (ORTHOLOGY-ALLIANCE_COMBINED), covering distinct functional categories
# (cytoskeleton, glycolysis, translation, ribosome, proteasome, ubiquitin,
# chaperones, histone, DNA replication, transcription, splicing, antioxidant).
# Validated against complete real data (STRING, TFLink, GAF: 100% covered;
# coxpresdb: 22/23, only His2B has no file — histones tend to be left out of panels).
#
# See docs/knowledge-graph/sample-generation.md for the full methodology.

