Title: BioCypher graph schema configuration file (Biolink-adapted for dmel)

##################             NODES   SECTION             ####################

dmel disease model:
  represented_as: node
  input_label: dmel_disease_model
  is_a: biological entity
  mixins:
  - biolink:DiseaseModel
  - biolink:OrganismalEntity
  biolink_category: biolink:DiseaseModel
  properties:
    taxon_id:
      type: int
      biolink: taxon
      range: biolink:OrganismTaxon
    gene:
      type: str
      biolink: has_gene_or_gene_product
    do_qualifier:
      type: str
      biolink: qualifier
    do_term_id:
      type: str
      biolink: in_disease
    do_term_name:
      type: str
      biolink: name
    allele:
      type: str
      biolink: has_attribute
    ortholog_hgnc_id:
      type: str
      biolink: id
    ortholog_hgnc_symbol:
      type: str
      biolink: symbol
    evidence_code:
      type: str
      biolink: has_evidence
    interacting_alleles:
      type: str[]
      biolink: has_attribute
    ev_code_interact_alleles:
      type: str
      biolink: has_evidence
    reference_FBrf_id:
      type: str
      biolink: publication
  kgx_properties:
    category: biolink:DiseaseModel

gene group:
  represented_as: node
  input_label: gene_group
  is_a: biological entity
  mixins:
  - biolink:GeneGroup
  biolink_category: biolink:GeneGroup
  properties:
    genes:
      type: str[]
      biolink: has_gene_or_gene_product
    group_symbol:
      type: str
      biolink: symbol
    group_name:
      type: str
      biolink: name
    parent_groups:
      type: str[]
      biolink: subclass_of
    HGNC_family_ID:
      type: str[]
      biolink: id
    taxon_id:
      type: int
      biolink: taxon
      range: biolink:OrganismTaxon
  kgx_properties:
    category: biolink:GeneGroup

genotype:
  represented_as: node
  input_label: genotype
  is_a: biological entity
  mixins:
  - biolink:Genotype
  biolink_category: biolink:Genotype
  properties:
    genotype_ids:
      type: str
      biolink: id
    genotype_symbols:
      type: str
      biolink: symbol
    reference:
      type: str
      biolink: publication
    taxon_id:
      type: int
      biolink: taxon
      range: biolink:OrganismTaxon
  kgx_properties:
    category: biolink:Genotype

metabolic pathway gene group:
  represented_as: node
  input_label: metabolic_pathway_gene_group
  is_a: biological entity
  mixins:
  - biolink:Pathway
  - biolink:GeneGroup
  biolink_category: biolink:Pathway
  properties:
    taxon_id:
      type: int
      biolink: taxon
      range: biolink:OrganismTaxon
    genes:
      type: str[]
      biolink: has_gene_or_gene_product
    group_symbol:
      type: str
      biolink: symbol
    group_name:
      type: str
      biolink: name
    parent_groups:
      type: str[]
      biolink: subclass_of
    HGNC_family_ID:
      type: str[]
      biolink: id
  kgx_properties:
    category: biolink:Pathway

phenotype_set:
  represented_as: node
  input_label: phenotype_set
  is_a: biological entity
  mixins:
  - biolink:PhenotypicFeature
  biolink_category: biolink:PhenotypicFeature
  properties:
    phenotype_ontology_id:
      type: str
      biolink: has_attribute
    taxon_id:
      type: int
      biolink: taxon
      range: biolink:OrganismTaxon
  kgx_properties:
    category: biolink:PhenotypicFeature

rnaseq library:
  is_a: entity
  represented_as: node
  inherit_properties: false
  input_label: rnaseq_library
  mixins:
  - biolink:DataSet
  biolink_category: biolink:DataSet
  description: A library/cluster/sample that is a set of genes and their expression
    values.
  properties:
    name:
      type: str
      biolink: name
    experiment_info:
      type: str[]
      biolink: has_attribute
    tissue_info:
      type: str[]
      biolink: has_attribute
    cell_type_id:
      type: str
      biolink: has_cell_type
    anatomy_entity_id:
      type: str[]
      biolink: anatomical_entity
    taxon_id:
      type: int
      biolink: taxon
      range: biolink:OrganismTaxon
    source:
      type: str
      biolink: knowledge_source
    source_url:
      type: str
      biolink: source_web_page
  kgx_properties:
    category: biolink:DataSet

signaling pathway gene group:
  represented_as: node
  input_label: signaling_pathway_gene_group
  is_a: biological entity
  mixins:
  - biolink:Pathway
  - biolink:GeneGroup
  biolink_category: biolink:Pathway
  properties:
    taxon_id:
      type: int
      biolink: taxon
      range: biolink:OrganismTaxon
    genes:
      type: str[]
      biolink: has_gene_or_gene_product
    group_symbol:
      type: str
      biolink: symbol
    group_name:
      type: str
      biolink: name
    parent_groups:
      type: str[]
      biolink: subclass_of
    HGNC_family_ID:
      type: str[]
      biolink: id
  kgx_properties:
    category: biolink:Pathway

dmel enhancer:
  is_a: enhancer
  represented_as: node
  input_label: enhancer
  inherit_properties: true
  description: >
    A FlyBase regulatory_region entry whose Name contains 'enhancer' and
    carries an associated_genes attribute.  ~121 entries in r6.69.
  properties:
    name:
      type: str
      biolink: name
      description: FlyBase Name= attribute from the GFF3 record

dmel regulatory region:
  is_a: regulatory region
  represented_as: node
  input_label: regulatory_region
  inherit_properties: true
  description: >
    A FlyBase regulatory feature (insulator, protein_binding_site,
    regulatory_region, TSS) from the dmel whole-genome GFF3.
  properties:
    name:
      type: str
      biolink: name
    library:
      type: str
      description: Library identifier from FlyBase library= attribute (text after ':')
    feature_type:
      type: str
      description: GFF3 feature type (e.g. insulator, TSS, protein_binding_site, regulatory_region)
    so_term:
      type: str
      description: Sequence Ontology term ID for this feature type

dmel transcription binding site:
  is_a: regulatory region
  represented_as: node
  input_label: tfbs
  inherit_properties: true
  description: >
    A TF_binding_site from the FlyBase GFF3.  Uses location-based IDs
    (chr_start_end_assembly) consistent with the existing tfbs_adapter.
    Inherits from regulatory region per the Sequence Ontology hierarchy.
  properties:
    source_id:
      type: str
      description: Original FlyBase FBsf ID from the GFF3 ID= attribute


