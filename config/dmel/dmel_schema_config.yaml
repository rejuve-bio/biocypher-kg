# ---------- FlyBase regulatory annotation edges ----------

dmel enhancer to gene association:
  is_a: enhancer to gene association
  represented_as: edge
  input_label: enhancer_gene
  output_label: associated_with
  source: enhancer
  target: gene
  inherit_properties: true
  description: >
    An association between a FlyBase enhancer and a gene it regulates,
    derived from the associated_genes attribute in the dmel GFF3.
  properties:
    confirmed:
      type: bool
      description: >
        Qualitative confirmation flag.  Always true for FlyBase GFF3 data
        (no interaction score is available).
  kgx_properties:
    subject_category: biolink:RegulatoryRegion
    object_category: biolink:Gene
    knowledge_level: knowledge_assertion
    agent_type: manual_agent

dmel gene to transcription binding site association:
  is_a: gene to transcription binding site association
  represented_as: edge
  input_label: gene_tfbs
  output_label: binds_to
  source: gene
  target: tfbs
  inherit_properties: true
  description: >
    A gene binds_to TFBS edge derived from the bound_moiety attribute
    of TF_binding_site records in the FlyBase GFF3.
  properties:
    source_id:
      type: str
      description: Original FlyBase FBsf ID for the TF_binding_site record
  kgx_properties:
    subject_category: biolink:Gene
    object_category: biolink:RegulatoryRegion
    knowledge_level: knowledge_assertion
    agent_type: manual_agent

dmel regulatory feature to sequence type:
  is_a: annotation
  inherit_properties: true
  represented_as: edge
  input_label: regulatory_feature_classified_as
  output_label: classified_as
  biolink_predicate: biolink:classified_as
  source: regulatory region
  target: sequence type
  description: >
    Links a FlyBase regulatory feature to its corresponding Sequence
    Ontology term (SO:0000627, SO:0000410, SO:0005836, SO:0000315).
  properties:
    taxon_id:
      type: int
      biolink: taxon
  kgx_properties:
    subject_category: biolink:RegulatoryRegion
    object_category: biolink:OntologyClass
    knowledge_level: knowledge_assertion
    agent_type: manual_agent

dmel tfbs to sequence type:
  is_a: annotation
  inherit_properties: true
  represented_as: edge
  input_label: tfbs_classified_as
  output_label: classified_as
  biolink_predicate: biolink:classified_as
  source: transcription binding site
  target: sequence type
  description: >
    Links a FlyBase TFBS to its corresponding Sequence
    Ontology term (SO:0000235).
  properties:
    taxon_id:
      type: int
      biolink: taxon
  kgx_properties:
    subject_category: biolink:RegulatoryRegion
    object_category: biolink:OntologyClass
