# Anchor genes for connected sample KG generation (connected_full_sample_data branch).
#
# Same housekeeping gene curation used in config/dmel/dmel_anchor_genes.yaml
# (reciprocal "best score" orthology via Alliance of Genome Resources), here
# with the canonical ENSG (Ensembl gene ID) of each chosen human gene. IDs
# were resolved via aux_files/hsa/hgnc/hgnc_mapping.pkl (HGNC -> symbol -> ENSG)
# and confirmed present in the real GTF
# (gencode.v49.chr_patch_hapl_scaff.annotation.gtf.gz).
#
# See docs/knowledge-graph/sample-generation.md for the full methodology and the
# cross-species table.

anchor_genes:
  - {symbol: ACTB, ensg: ENSG00000075624, category: cytoskeleton}
