gencode:
  name: GENCODE v49
  version: {strategy: url_regex, pattern: 'gencode\.(v\d+)\.', vtype: sequential}
  source_url: https://www.gencodegenes.org/
  extract: false
  url:
    # Pinned to release_49/ (not latest_release/, which now serves v50+ and
    # 404s on these v49-named files) -- the v49 pin matches gencode_gene_adapter.py's
    # self.version and adapters/__init__.py's SPECIES_INFO features_data_url, both
    # hardcoded to v49 too. Bumping the pin means updating all three together.
    #
    # Primary assembly, reference chromosomes only -- used by the real KG
    # adapters (gencode_gene_adapter.py etc, see hsa_adapters_config.yaml).
    - https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_49/gencode.v49.annotation.gtf.gz
    # Comprehensive: reference chromosomes + scaffolds + assembly patches +
    # alternate loci (haplotypes) -- used by scripts/generate_connected_sample.py's
    # gene<->transcript backbone map (SOURCE_FILES["hsa"]["gtf"]), which wants the
    # widest possible transcript coverage for genes on alternate loci.
    - https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_49/gencode.v49.chr_patch_hapl_scaff.annotation.gtf.gz
  local_files:
    gtf: {pattern: "gencode/gencode.v*.chr_patch_hapl_scaff.annotation.gtf.gz", stable_name: "ensembl/gencode.gtf.gz"}

