input_dir: /mnt/hdd_1/biocypher-kg/input/mmu

eva_snp:
  adapter:
    module: biocypher_metta.adapters.eva_adapter
    cls: EVAAdapter
    args:
      filepath: eva/10090_GCA_000001635.9_current_ids.vcf.gz
      taxon_id: 10090
      label: snp
  outdir: mmu/eva
  nodes: True
  edges: False

eva_snp_in_gene:
  adapter:
    module: biocypher_metta.adapters.eva_adapter
    cls: EVAAdapter
    args:
      filepath: eva/10090_GCA_000001635.9_current_ids.vcf.gz
      gene_filepath: gencode/gencode.vM38.chr_patch_hapl_scaff.annotation.gtf.gz
      taxon_id: 10090
      label: snp_in_gene
  outdir: mmu/eva
  nodes: False
  edges: True

emapa:
  adapter:
    module: biocypher_metta.adapters.mmu.emapa_adapter
    cls: EmapaAdapter
    args:
      ontology: "emapa"
      type: node
      label: anatomy
      dry_run: False
      add_description: False
      cache_dir: ./ontology_dataset_cache
  outdir: emapa
  nodes: True
  edges: False

emapa_subclass_of:
  adapter:
    module: biocypher_metta.adapters.mmu.emapa_adapter
    cls: EmapaAdapter
    args:
      ontology: "emapa"
      type: edge
      label: anatomy_subclass_of
      dry_run: False
      cache_dir: ./ontology_dataset_cache
  outdir: emapa
  nodes: False
  edges: True
