input_dir: /mnt/hdd_1/biocypher-kg/input/mmu

eva_snp:
  adapter:
    module: biocypher_metta.adapters.eva_adapter
    cls: EVAAdapter
    args:
      filepath: eva/10090_GCA_000001635.9_current_ids.vcf.gz
      taxon_id: 10090
      label: snp
  outdir: mmu/eva
  nodes: True
  edges: False

eva_snp_in_gene:
  adapter:
    module: biocypher_metta.adapters.eva_adapter
    cls: EVAAdapter
    args:
      filepath: eva/10090_GCA_000001635.9_current_ids.vcf.gz
      gene_filepath: gencode/gencode.vM38.chr_patch_hapl_scaff.annotation.gtf.gz
      taxon_id: 10090
      label: snp_in_gene
  outdir: mmu/eva
  nodes: False
  edges: True
