# Anchor genes for connected sample KG generation (connected_full_sample_data branch).
#
# Same housekeeping gene curation used in config/dmel/dmel_anchor_genes.yaml
# and config/hsa/hsa_anchor_genes.yaml, here with the orthologous ENSMUSG
# (Ensembl mouse gene ID) for each gene, resolved via symbol->Ensembl dbXrefs
# in Mus_musculus.gene_info.gz and confirmed present in the real GTF
# (gencode.vM38.chr_patch_hapl_scaff.annotation.gtf.gz).
#
# See docs/knowledge-graph/sample-generation.md for the full methodology and the
# cross-species table.

anchor_genes:
