# ---
input_dir: /mnt/hdd_1/biocypher-kg/input/mmu

alliance:
  name: Alliance of Genome Resources
  version: {strategy: url_regex, pattern: 'alliancegenome\.org/(\d+\.\d+\.\d+)/', vtype: semver}
  extract: false
  url:
    - https://fms.alliancegenome.org/download/DISEASE-ALLIANCE_COMBINED.tsv.gz  # gene to disease
    - https://download.alliancegenome.org/8.3.0/EXPRESSION-ALLIANCE/COMBINED/EXPRESSION-ALLIANCE_COMBINED_6.tsv.gz  # gene to expression location (ontologies like GO, FBbt, etc) NO HUMAN DATA
    - https://download.alliancegenome.org/8.3.0/INTERACTION-MOL/COMBINED/INTERACTION-MOL_COMBINED_5.tsv.gz          # Format is like that processed by dmel.dmel_physical_interaction_psimi_adapter
    - https://fms.alliancegenome.org/download/ORTHOLOGY-ALLIANCE_COMBINED.tsv.gz
    - https://fms.alliancegenome.org/download/VCF_GRCm39.vcf.gz 
    - https://fms.alliancegenome.org/download/VARIANT-ALLELE_NCBITaxon10090.tsv.gz    # look at EVA  VCF
  local_files:
    alliance_disease: {pattern: "alliance/DISEASE-ALLIANCE_COMBINED.tsv.gz", stable_name: "alliance/DISEASE-ALLIANCE_COMBINED.tsv.gz"}
    alliance_orthology: {pattern: "alliance/ORTHOLOGY-ALLIANCE_COMBINED.tsv.gz", stable_name: "alliance/ORTHOLOGY-ALLIANCE_COMBINED.tsv.gz"}

bgee:
  name: Bgee Expression Data
  extract: false
  url: https://www.bgee.org/ftp/current/download/calls/expr_calls/Mus_musculus_expr_simple_all_conditions.tsv.gz
  local_files:
    bgee: {pattern: "bgee/Mus_musculus_expr_simple_all_conditions.tsv.gz", stable_name: "bgee/Mus_musculus_expr_simple_all_conditions.tsv.gz"}

coxpressdb:
  name: Coxpress DB
  version: {strategy: url_regex, pattern: '\.(v[\d-]+)\.', vtype: other}
  extract: true
  url: https://zenodo.org/record/6861444/files/Mmu-r.v22-05.G17008-S214753.combat_pca.subagging.z.d.zip

# enhancer_atlas:
#   name: EnhancerAtlas
#   url: http://www.enhanceratlas.org/data/download/enhancer_atlas_2.0/7227_all_tissues.bed   
    
epd:
  name: Eukaryotic Promoter Database
  compress: gzip
  url: https://epd.expasy.org/ftp/epdnew/M_musculus/current/Mm_EPDnew.bed
  local_files:
    epd: {pattern: "epd/Mm_EPDnew.bed.gz", stable_name: "epd/Mm_EPDnew.bed.gz"}

gaf:
  name: GO Annotation File (GAF) from MGI
  extract: false
  url: https://current.geneontology.org/annotations/mgi.gaf.gz
  local_files:
    gaf: {pattern: "gaf/mgi.gaf.gz", stable_name: "gaf/mgi.gaf.gz"}

gencode:
  name: GENCODE Release M38 (GRCm39)
  version: {strategy: url_regex, pattern: 'gencode\.(vM\d+)\.', vtype: sequential}
  source_url: https://www.gencodegenes.org/
  extract: false
  url:
    - https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_mouse/release_M38/gencode.vM38.chr_patch_hapl_scaff.annotation.gtf.gz
  local_files:
    gtf: {pattern: "gencode/gencode.vM*.chr_patch_hapl_scaff.annotation.gtf.gz", stable_name: "ensembl/gencode.gtf.gz"}

reactome:
  name: Reactome
  url:
    - https://reactome.org/download/current/ReactomePathways.txt
    - https://reactome.org/download/current/ReactomePathwaysRelation.txt
    - https://reactome.org/download/current/Ensembl2Reactome_All_Levels.txt
    - https://reactome.org/download/current/Ensembl2ReactomeReactions.txt
    - https://reactome.org/download/current/ReactionPMIDS.txt
    - https://reactome.org/download/current/ChEBI2Reactome_All_Levels.txt
    - https://reactome.org/download/current/ChEBI2ReactomeReactions.txt
    - https://reactome.org/download/current/interactors/reactome.all_species.interactions.tab-delimited.txt
  local_files:
    reactome_all_levels: {pattern: "reactome/Ensembl2Reactome_All_Levels.txt", stable_name: "reactome/Ensembl2Reactome_All_Levels.txt"}
    reactome_chebi_pathways: {pattern: "reactome/ChEBI2Reactome_All_Levels.txt", stable_name: "reactome/ChEBI2Reactome_All_Levels.txt"}
    reactome_chebi_reactions: {pattern: "reactome/ChEBI2ReactomeReactions.txt", stable_name: "reactome/ChEBI2ReactomeReactions.txt"}
    reactome_pathways: {pattern: "reactome/ReactomePathways.txt", stable_name: "reactome/ReactomePathways.txt"}
    reactome_pathways_relation: {pattern: "reactome/ReactomePathwaysRelation.txt", stable_name: "reactome/ReactomePathwaysRelation.txt"}
    reactome_ppi: {pattern: "reactome/reactome.all_species.interactions.tab-delimited.txt", stable_name: "reactome/reactome.all_species.interactions.tab-delimited.txt"}
    reactome_reaction_exporter: {pattern: "reactome/reactome_reaction_exporter_All_species.txt", stable_name: "reactome/reactome_reaction_exporter_All_species.txt"}
    reactome_reaction_pmids: {pattern: "reactome/ReactionPMIDS.txt", stable_name: "reactome/ReactionPMIDS.txt"}
    reactome_reactions: {pattern: "reactome/Ensembl2ReactomeReactions.txt", stable_name: "reactome/Ensembl2ReactomeReactions.txt"}

rna_central:
  name: RNA Central
  extract: false
  url:
    - https://ftp.ebi.ac.uk/pub/databases/RNAcentral/current_release/genome_coordinates/bed/mus_musculus.GRCm39.bed.gz
    - https://ftp.ebi.ac.uk/pub/databases/RNAcentral/current_release/go_annotations/rnacentral_rfam_annotations.tsv.gz
  local_files:
    rna_central_bed: {pattern: "rna_central/mus_musculus.GRCm39.bed.gz", stable_name: "rna_central/mus_musculus.GRCm39.bed.gz"}
    rna_central_rfam: {pattern: "rna_central/rnacentral_rfam_annotations.tsv.gz", stable_name: "rna_central/rnacentral_rfam_annotations.tsv.gz"}

string:
  name: STRING PPI
  version: {strategy: url_regex, pattern: 'protein\.links\.(?:detailed\.)?(v[\d.]+)', vtype: semver}
  extract: false
  url:
    - https://stringdb-downloads.org/download/protein.links.v12.0/10090.protein.links.v12.0.txt.gz
    - https://stringdb-downloads.org/download/protein.links.detailed.v12.0/10090.protein.links.detailed.v12.0.txt.gz
  local_files:
    string_coexpression: {pattern: "string/10090.protein.links.detailed.v*.txt.gz", stable_name: "string/10090.protein.links.detailed.txt.gz"}
    string_ppi: {pattern: "string/10090.protein.links.v*.txt.gz", stable_name: "string/10090.protein.links.txt.gz"}

tflink:
  name: TFLink
  version: {strategy: url_regex, pattern: '_(v[\d.]+)\.tsv', vtype: semver}
  extract: false
  url: https://cdn.netbiol.org/tflink/download_files/TFLink_Mus_musculus_interactions_All_simpleFormat_v1.0.tsv.gz
  local_files:
    tflink: {pattern: "tflink/TFLink_Mus_musculus_interactions_All_simpleFormat_v*.tsv.gz", stable_name: "tflink/TFLink_Mus_musculus_interactions_All_simpleFormat.tsv.gz"}

uniprot:
  name: UniProtKB/Swiss-Prot
  extract: false
  url: https://ftp.uniprot.org/pub/databases/uniprot/current_release/knowledgebase/taxonomic_divisions/uniprot_sprot_rodents.dat.gz
  local_files:
    uniprot_dat: {pattern: "uniprot/uniprot_sprot_rodents.dat.gz", stable_name: "uniprot/uniprot_sprot_rodents.dat.gz"}

ensembl:  # NCBI gene_info, used to build the gene<->MGI id map for GAF matching
  name: NCBI gene_info
  extract: false
  url:
    - https://ftp.ncbi.nih.gov/gene/DATA/GENE_INFO/Mammalia/Mus_musculus.gene_info.gz
  local_files:
    gene_info: {pattern: "ensembl/Mus_musculus.gene_info.gz", stable_name: null}
