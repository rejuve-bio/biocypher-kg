# Anchor genes for connected sample KG generation (connected_full_sample_data branch).
#
# Same housekeeping gene curation used in config/dmel/dmel_anchor_genes.yaml
# and config/hsa/hsa_anchor_genes.yaml, here with the orthologous ENSRNOG
# (Ensembl rat gene ID) for each gene, resolved via symbol->Ensembl dbXrefs
# in Rattus_norvegicus.gene_info.gz and confirmed present in the real GTF
# (Rattus_norvegicus.GRCr8.116.gtf.gz).
#
# See docs/knowledge-graph/sample-generation.md for the full methodology and the
# cross-species table.

anchor_genes:
