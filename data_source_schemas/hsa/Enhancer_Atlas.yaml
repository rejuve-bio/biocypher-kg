name: Enhancer Atlas
website: http://singlecelldb.com
kg_coordinate_convention: 1-based closed
nodes:
  enhancer:
    url: http://singlecelldb.com/downloadv2.php
    input_label: enhancer
    properties:
      biological_context: str
      chr: str
      end: int
      start: int
      taxon_id: int
    coordinates:
      source_convention: 0-based half-open
      source_assembly: hg19
      start_offset: 1
      end_offset: 0
      note: 'Known issue: the configured hsa file is hg19 and is not lifted, although
        node IDs say GRCh38. A lifted (offline, UCSC liftOver) input exists on another
        branch.'
relationships:
  enhancer to gene association:
    url: http://singlecelldb.com/downloadv2.php
    input_label: enhancer_gene
    output_label: associated_with
    description: An association between an enhancer and a gene
    source: enhancer
    target: gene
    properties:
      biological_context: str
      score: float
