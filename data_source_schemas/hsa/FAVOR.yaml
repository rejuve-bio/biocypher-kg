name: FAVOR
website: http://favor.genohub.org
kg_coordinate_convention: 1-based closed
nodes:
  snp:
    url: http://favor.genohub.org/
    input_label: snp
    description: 'A single nucleotide polymorphism (SNP): a single-nucleotide variation
      at a specific genomic position, for any species. Subtype of allele.'
    properties:
      alt: str
      chr: str
      end: int
      ref: str
      start: int
      taxon_id: int
    coordinates:
      source_convention: 1-based closed
      source_assembly: GRCh38
      start_offset: 0
      end_offset: 0
      note: FAVOR position is the VCF POS
