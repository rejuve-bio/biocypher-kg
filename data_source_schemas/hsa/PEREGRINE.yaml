name: PEREGRINE
website: https://www.peregrineproj.org
kg_coordinate_convention: 1-based closed
nodes:
  enhancer:
    url: https://www.peregrineproj.org/
    input_label: enhancer
    properties:
      biological_context: str
      chr: str
      data_source: str
      end: int
      enhancer_id: str
      start: int
      taxon_id: int
    coordinates:
      source_convention: mixed
      source_assembly: GRCh38
      components:
        FANTOM:
          source_convention: 0-based half-open
          start_offset: 1
          end_offset: 0
        ENCODE:
          source_convention: 0-based half-open
          start_offset: 1
          end_offset: 0
        Ensembl:
          source_convention: 1-based closed
          start_offset: 0
          end_offset: 0
        VISTA:
          source_convention: 1-based closed
          start_offset: 0
          end_offset: 0
      note: 'Per-record sub-source from PEREGRINEenhancersources. Verified Nov 2026
        by exact positional match after hg19->hg38 liftOver (check_peregrine_coords.py):
        ENCODE vs ENCFF788SJC (100%), FANTOM vs FANTOM5 permissive phase 1+2 (100%),
        Ensembl vs GRCh37 Regulatory Build 20161117/release 87 (99.6% of 28,173 matched);
        VISTA verified against vista-data. PEREGRINE does not document its convention;
        the file mixes conventions.'
relationships:
  enhancer to gene association:
    url: https://www.peregrineproj.org/
    input_label: enhancer_gene
    output_label: associated_with
    description: An association between an enhancer and a gene
    source: enhancer
    target: gene
    properties:
      biological_context: str
      score: float
