name: RefSeq Closest Gene
website: https://forgedb.cancer.gov
relationships:
  closest gene to variant association:
    url: https://forgedb.cancer.gov/api/closest_gene/v1.0/closest_gene.forgedb.csv.gz
    input_label: closest_gene
    description: holds between a sequence variant and a gene that is closest to the
      variant
    source: snp
    target: gene
    properties:
      chr: str
      distance: int
      pos: int
    coordinates:
      kg_convention: 1-based closed
      source_convention: mixed
      source_assembly: GRCh38
      components:
        dbSNP map pos:
          source_convention: 1-based closed
          start_offset: 0
          end_offset: 0
        closest-gene file gene start:
          source_convention: 0-based half-open
          start_offset: 1
          end_offset: 0
      note: pos comes from the dbSNP map; distance = (gene_start + 1) - pos
