name: TADMap
website: https://cb.csail.mit.edu
kg_coordinate_convention: 1-based closed
nodes:
  tad:
    url: https://cb.csail.mit.edu/cb/tadmap/
    input_label: tad
    properties:
      chr: str
      end: int
      start: int
      taxon_id: int
    coordinates:
      source_convention: 0-based half-open
      source_assembly: GRCh38
      start_offset: 1
      end_offset: 0
      note: TADMap scaffold BED coordinates embedded in the geneset CSV
relationships:
  gene in tad region:
    url: https://cb.csail.mit.edu/cb/tadmap/
    input_label: in_tad_region
    description: holds between a tad and a gene that is in the tad region
    source: gene
    target: tad
    properties:
      taxon_id: int
