name: dbSNP
website: https://ftp.ncbi.nih.gov
kg_coordinate_convention: 1-based closed
nodes:
  snp:
    url: https://ftp.ncbi.nih.gov/snp/organisms/human_9606_b151_GRCh38p7/VCF/
    input_label: snp
    description: 'A single nucleotide polymorphism (SNP): a single-nucleotide variation
      at a specific genomic position, for any species. Subtype of allele.'
    properties:
      alt: str
      caf_alt: str
      caf_ref: str
      chr: str
      end: int
      ref: str
      start: int
      taxon_id: int
    coordinates:
      source_convention: 1-based closed
      source_assembly: GRCh38
      start_offset: 0
      end_offset: 0
      note: VCF POS; SNPs are stored with start == end == POS
