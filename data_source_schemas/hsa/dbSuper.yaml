name: dbSuper
website: https://asntech.org
nodes:
  super enhancer:
    url: https://asntech.org/dbsuper/download.php
    input_label: super_enhancer
    properties:
      biological_context: str
      chr: str
      end: int
      se_id: str
      start: int
      taxon_id: int
    coordinates:
      kg_convention: 1-based closed
      source_convention: 0-based half-open
      source_assembly: hg19
      start_offset: 1
      end_offset: 0
      liftover: hg19 -> GRCh38 by the downloader (UCSC liftOver, minMatch 0.90); the
        adapter reads the lifted file
      note: Undocumented by dbSUPER; BED-like (MACS/ROSE output)
relationships:
  super enhancer to gene association:
    url: https://asntech.org/dbsuper/download.php
    input_label: super_enhancer_gene
    output_label: associated_with
    description: An association between a super enhancer and a gene
    source: super enhancer
    target: gene
    properties:
      biological_context: str
