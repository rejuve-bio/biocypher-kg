# BioCypher KG Console — docker compose.
#
#   docker compose -f docker/docker-compose.console.yml up --build
#   open http://localhost:${CONSOLE_PORT:-9000}/console/
#
# The build context is the repo root (..), since the image needs the whole
# pipeline to launch builds.
services:
  console:
    build:
      context: ..
      dockerfile: Dockerfile
    image: biocypher-kg-console
    ports:
      # Single knob: CONSOLE_PORT drives BOTH the host mapping and the container's
      # internal bind (below), so the uvicorn log matches the port you chose.
      # e.g.  CONSOLE_PORT=8080 docker compose -f docker/docker-compose.console.yml up
      - "${CONSOLE_PORT:-9000}:${CONSOLE_PORT:-9000}"
    environment:
      PORT: "${CONSOLE_PORT:-9000}"
      REPO_ROOT: /app
      BUILDS_DIR: /app/kg-service/.builds
      MAX_CONCURRENT_BUILDS: "1"
      # Point at a Neo4j for the Observatory endpoints (optional; Console works without it):
      # NEO4J_URI: bolt://host.docker.internal:7887
      # NEO4J_USER: neo4j
      # NEO4J_PASSWORD: your_password
      # NEO4J_DATABASE: neo4j
    volumes:
      # Build jobs/logs/output on the HOST (visible on disk, survives restarts).
      - ${HOST_BUILDS_DIR:-../kg-service/.builds}:/app/kg-service/.builds
      # Broad host data root, mounted same-path. Set DATA_ROOT once; the wizard's
      # Output directory can be any path under it (never repeated in env).
      - ${DATA_ROOT:-${HOME}}:${DATA_ROOT:-${HOME}}
      # For real (full) builds, mount your downloaded input data and point the
      # adapters config / --input-dir at it, e.g.:
      # - /mnt/hdd_1/biocypher-kg/input:/data
