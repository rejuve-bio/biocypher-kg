# Repo-free way to run the BioCypher KG Console from a prebuilt image.
#
# Unlike docker/docker-compose.yml (which builds from the source tree), this file
# only PULLS the published image and runs it. You need just this one file: no
# checkout, no env file. Everything else (each species' databases, the data and
# Builds folders, build settings) is set in the Console's Settings page and persists
# in the named volume below.
#
#   CONSOLE_IMAGE=ghcr.io/kedists/biocypher-kg-console:latest \
#     docker compose -f docker-compose.dist.yml up -d
#
# Then open http://localhost:9000/console/.
#
# A database on this computer is entered as localhost in Settings; the console
# connects to it through host.docker.internal on its own.
name: biocypher-console

services:
  console:
    image: ${CONSOLE_IMAGE:-ghcr.io/kedists/biocypher-kg-console:latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      # This computer only, unless CONSOLE_BIND (with CONSOLE_ALLOWED_HOSTS and a
      # CONSOLE_PASSWORD) puts it on the network.
      - "${CONSOLE_BIND:-127.0.0.1}:${CONSOLE_PORT:-9000}:9000"
    environment:
      PORT: "9000"
      # Only for running behind a reverse proxy under another name (see the
      # deployment guide); empty means this computer only.
      CONSOLE_ALLOWED_HOSTS: "${CONSOLE_ALLOWED_HOSTS:-}"
      CONSOLE_ALLOWED_ORIGINS: "${CONSOLE_ALLOWED_ORIGINS:-}"
      CONSOLE_PASSWORD: "${CONSOLE_PASSWORD:-}"
    volumes:
      # Persists the Settings store (console_settings.json, which holds the saved
      # connections) and the build history across restarts and image updates.
      - console_builds:/app/kg-service/.builds
      # This instance's own config (Config page edits stay here, never in the image).
      - console_config:/app/config
      # Lets the console set up, start and stop each species' Neo4j and MORK from
      # Settings > Species databases. This gives it control of Docker on this
      # machine, so keep the console bound to localhost (as above).
      - /var/run/docker.sock:/var/run/docker.sock
      # What a Finder sidebar shows, at the same path on both sides. The data and
      # Builds folders are chosen here in Settings (Browse… opens Finder); there's no
      # default folder. Writable for those two; the console only reads folders chosen
      # as source data or a dbSNP cache.
      # Don't share the whole home folder instead: Docker Desktop passes every file
      # change in a shared folder to its VM, and a home folder changes so constantly
      # that it crashes the engine. These folders are quiet enough (tested).
      - "${HOME}/Desktop:${HOME}/Desktop"
      - "${HOME}/Documents:${HOME}/Documents"
      - "${HOME}/Downloads:${HOME}/Downloads"
      - "/Volumes:/Volumes"  # external drives (macOS)
    # Lets the container reach a Neo4j/MORK published on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Nothing in the console may gain more rights than it started with.
    security_opt:
      - "no-new-privileges:true"

volumes:
  console_builds:
  console_config:
