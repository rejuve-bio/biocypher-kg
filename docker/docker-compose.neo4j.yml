version: "3.9"

# Load defaults from docker/neo4j.env via:
#   docker compose --env-file docker/neo4j.env -f docker/docker-compose.neo4j.yml up -d
# Or use the Makefile targets:
#   make neo4j-up / neo4j-down / neo4j-load / neo4j-logs / neo4j-status

services:
  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:5.21}
    container_name: ${NEO4J_CONTAINER:-neo4j_bio_atomspace}
    restart: always
    ports:
      - "${NEO4J_HTTP_PORT:-7674}:7474"
      - "${NEO4J_BOLT_PORT:-7887}:7687"

    environment:
      NEO4J_AUTH: "${NEO4J_AUTH:-neo4j/neo4j}"

      # APOC plugin
      NEO4JLABS_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      # Allow APOC LOAD CSV to resolve file:///relative.csv against /import
      # (rather than the internal Neo4j home path)
      NEO4J_apoc_import_file_use__neo4j__config: "false"

      # Procedure permissions
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*"

      # Allow LOAD CSV from absolute file:/// URLs anywhere the server can read,
      # so builds can be loaded from ANY directory under the mounted import root.
      # NOTE: dbms.directories.import is intentionally NOT set — when it is set,
      # Neo4j forces every file:// URL to be RELATIVE to it (absolute paths get
      # prefixed and fail). Leaving it unset + allow_csv..._from_file_urls=true lets
      # the loader use absolute file:///<build dir>/... via --import-dir.
      NEO4J_dbms_security_allow__csv__import__from__file__urls: "true"
      # Set the import root to "/" so absolute file:///<abs> URLs resolve to the real
      # absolute path (Neo4j resolves file:// relative to this root). Combined with the
      # same-path bind mount below, this lets the loader import from ANY directory.
      NEO4J_server_directories_import: "/"

      # Memory tuning
      NEO4J_dbms_memory_pagecache_size: "${NEO4J_PAGECACHE:-4G}"
      NEO4J_dbms_memory_heap_initial__size: "${NEO4J_HEAP_INIT:-2G}"
      NEO4J_dbms_memory_heap_max__size: "${NEO4J_HEAP_MAX:-4G}"

    volumes:
      # Neo4j output dir is mounted read-only as the LOAD CSV import root
      - ${NEO4J_OUTPUT_DIR}:/import:ro
      # Broad host root mounted at the SAME path (read-only) so the loader can pass
      # --import-dir <any build dir under here> and LOAD CSV file:///<abs> resolves.
      # Set NEO4J_IMPORT_ROOT to the parent that contains your build outputs (e.g.
      # DATA_ROOT); defaults to the output dir so the mount is always valid.
      - ${NEO4J_IMPORT_ROOT:-${NEO4J_OUTPUT_DIR}}:${NEO4J_IMPORT_ROOT:-${NEO4J_OUTPUT_DIR}}:ro
      # Persistent storage
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
