# BioCypher KG — full stack: Console + Neo4j, one command brings everything up.
#
#   cp docker/console.env.example docker/console.env      # set ports + neo4j password
#   docker compose --env-file docker/console.env -f docker/docker-compose.stack.yml up --build
#
#   Console UI : http://localhost:${CONSOLE_PORT:-9000}/console/
#   Neo4j UI   : http://localhost:${NEO4J_HTTP_PORT:-7474}   (user/pass from console.env)
#
# The two containers share a compose network: the Console reaches Neo4j at the
# service hostname `neo4j` (bolt://neo4j:7687) — no localhost, no host ports needed
# between them.
services:
  console:
    build:
      context: ..
      dockerfile: Dockerfile
    image: biocypher-kg-console
    ports:
      - "${CONSOLE_PORT:-9000}:${CONSOLE_PORT:-9000}"
    environment:
      PORT: "${CONSOLE_PORT:-9000}"
      REPO_ROOT: /app
      BUILDS_DIR: /app/kg-service/.builds
      MAX_CONCURRENT_BUILDS: "${MAX_CONCURRENT_BUILDS:-1}"
      # Talk to the neo4j service over the compose network (not localhost).
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-neo4jpassword}"
      NEO4J_DATABASE: "${NEO4J_DATABASE:-neo4j}"
    volumes:
      # Build jobs/logs/output on the HOST (visible on disk).
      - ${HOST_BUILDS_DIR:-../kg-service/.builds}:/app/kg-service/.builds
      # Host dir for custom output paths, mounted at the SAME path in the container
      # (folder you type in the wizard == folder on your host).
      - ${HOST_OUTPUT_DIR:-/data/kg-output}:${HOST_OUTPUT_DIR:-/data/kg-output}
    depends_on:
      - neo4j

  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:5.21}
    restart: unless-stopped
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4jpassword}"
      NEO4JLABS_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/import

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
