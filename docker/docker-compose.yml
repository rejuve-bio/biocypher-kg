# BioCypher KG Console: start it with docker/up.sh, then open
# http://localhost:9000/console/. There's nothing to configure here and no env file:
# each species' databases, the data and Builds folders and how builds run are all set
# in the console's Settings page.
# Own project name so this stack never collides with the standalone Makefile Neo4j in this dir.
name: biocypher-console

services:
  console:
    build:
      context: ..
      dockerfile: Dockerfile
    # CONSOLE_IMAGE lets a local user pull a prebuilt image (e.g. from GHCR) instead
    # of building: set it + `up.sh --no-build` to avoid the local build entirely.
    image: ${CONSOLE_IMAGE:-biocypher-kg-console}
    # Survive host reboots and daemon restarts; only a manual `down`/`stop` keeps it down.
    restart: unless-stopped
    ports:
      # This computer only (127.0.0.1), unless up.sh --host puts it on the network,
      # where it asks for the password up.sh made (CONSOLE_PASSWORD).
      - "${CONSOLE_BIND:-127.0.0.1}:${CONSOLE_PORT:-9000}:${CONSOLE_PORT:-9000}"
    environment:
      PORT: "${CONSOLE_PORT:-9000}"
      REPO_ROOT: /app
      BUILDS_DIR: /app/kg-service/.builds
      # Only for running behind a reverse proxy under another name (see the
      # deployment guide); empty means this computer only.
      CONSOLE_ALLOWED_HOSTS: "${CONSOLE_ALLOWED_HOSTS:-}"
      CONSOLE_ALLOWED_ORIGINS: "${CONSOLE_ALLOWED_ORIGINS:-}"
      CONSOLE_PASSWORD: "${CONSOLE_PASSWORD:-}"
    volumes:
      # What a Finder sidebar shows, at the same path on both sides. The data and
      # Builds folders are chosen here in Settings (Browse… opens Finder); there's no
      # default folder. Writable for those two; the console only reads folders chosen
      # as source data or a dbSNP cache.
      # Don't share the whole home folder instead: Docker Desktop passes every file
      # change in a shared folder to its VM, and a home folder changes so constantly
      # that it crashes the engine. These folders are quiet enough (tested).
      - "${HOME}/Desktop:${HOME}/Desktop"
      - "${HOME}/Documents:${HOME}/Documents"
      - "${HOME}/Downloads:${HOME}/Downloads"
      - "/Volumes:/Volumes"  # external drives (macOS)
      # Named volume: Settings and build history survive image rebuilds.
      - console_builds:/app/kg-service/.builds
      # Lets the console set up, start and stop each species' Neo4j and MORK from
      # Settings > Species databases. This gives it control of Docker on this
      # machine, so keep the console bound to localhost (as above).
      - /var/run/docker.sock:/var/run/docker.sock
      # Repo config/ bind-mounted so Console config edits persist and builds use them.
      - ../config:/app/config
    # Lets the console reach a database you run on this computer (Settings > Use existing).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Nothing in the console may gain more rights than it started with.
    security_opt:
      - "no-new-privileges:true"

  # Never started: builds the MORK image (biocypher-console-mork) that Settings >
  # Species databases > Run here uses. up.sh builds it once when biocypher-mork/ exists.
  mork:
    profiles: ["mork-image"]
    image: biocypher-console-mork
    build:
      context: ../biocypher-mork
      args:
        # Pinned nightly; override RUST_NIGHTLY to bisect a broken one.
        RUST_NIGHTLY: "${RUST_NIGHTLY:-2026-07-01}"

volumes:
  console_builds:
